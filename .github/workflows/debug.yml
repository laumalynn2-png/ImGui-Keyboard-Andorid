name: Debug Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Debug ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [armeabi-v7a, arm64-v8a]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/ndk
          key: ndk-r28-linux-x64

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup_ndk
        with:
          ndk-version: r28

      - name: Configure CMake (Debug)
        run: |
          cmake -S . -B build/${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup_ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build/${{ matrix.abi }} -j $(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libDemo-debug-${{ matrix.abi }}
          path: build/${{ matrix.abi }}/libDemo.so
          if-no-files-found: error

  combine:
    name: Combine debug artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: libDemo-debug

      - name: Upload combined
        uses: actions/upload-artifact@v4
        with:
          name: libDemo-debug-all
          path: libDemo-debug
