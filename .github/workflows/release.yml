name: Release Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Release ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [armeabi-v7a, arm64-v8a]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup_ndk
        with:
          ndk-version: r26d

      - name: Configure CMake (Release)
        run: |
          cmake -S . -B build/${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup_ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/${{ matrix.abi }} -j $(nproc)

      - name: Strip binary
        run: |
          STRIP=${{ steps.setup_ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
          $STRIP --strip-all build/${{ matrix.abi }}/libDemo.so || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libDemo-release-${{ matrix.abi }}
          path: build/${{ matrix.abi }}/libDemo.so
          if-no-files-found: error

  combine:
    name: Combine release artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: libDemo-release

      - name: Upload combined
        uses: actions/upload-artifact@v4
        with:
          name: libDemo-release-all
          path: libDemo-release
